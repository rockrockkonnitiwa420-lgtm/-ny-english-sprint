<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NY English">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>NY English Sprint</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">NEW YORK STUDY MODE</div>
        <h1>NY English Sprint</h1>
      </div>
      <button id="levelBtn" class="level-pill">Level 1</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="hero card">
          <div class="hero-copy">
            <div class="muted">ニューヨークまで</div>
            <div class="countdown"><span id="daysLeft">--</span><small> DAYS</small></div>
            <div class="muted" id="departureText">出発日を設定してください</div>
          </div>
          <button id="setDateBtn" class="ghost-btn">出発日</button>
        </div>

        <div class="stats-grid">
          <div class="stat card"><b id="streak">0</b><span>連続日数</span></div>
          <div class="stat card"><b id="doneCount">0</b><span>完了レッスン</span></div>
          <div class="stat card"><b id="learnedCount">0</b><span>練習フレーズ</span></div>
        </div>

        <div class="section-head">
          <div><div class="eyebrow">TODAY</div><h2>今日の10分</h2></div>
          <span class="badge" id="levelName">超初級</span>
        </div>

        <div class="training-list">
          <button class="training card" data-mode="listen">
            <div class="num">01</div><div><b>LISTEN</b><span>英語を聞き取る 3分</span></div><div>›</div>
          </button>
          <button class="training card" data-mode="shadow">
            <div class="num">02</div><div><b>SHADOWING</b><span>聞いてすぐマネする 4分</span></div><div>›</div>
          </button>
          <button class="training card" data-mode="speak">
            <div class="num">03</div><div><b>SPEAK</b><span>自分の声で答える 3分</span></div><div>›</div>
          </button>
        </div>

        <div class="section-head"><div><div class="eyebrow">SCENES</div><h2>NYで使う場面</h2></div></div>
        <div id="sceneGrid" class="scene-grid"></div>

        <button id="survivalBtn" class="survival card">
          <div><div class="eyebrow">EMERGENCY</div><b>困った時の4フレーズ</b><span>これだけは口から出るようにする</span></div>
          <div>›</div>
        </button>
      </section>

      <section id="practiceView" class="view">
        <button id="backBtn" class="back-btn">‹ HOME</button>
        <div class="practice-head">
          <div class="eyebrow" id="modeLabel">LISTEN</div>
          <h2 id="practiceTitle">トレーニング</h2>
          <div class="progress-track"><div id="progressBar"></div></div>
          <div class="muted"><span id="questionIndex">1</span> / <span id="questionTotal">5</span></div>
        </div>

        <div class="practice-card card">
          <div id="sceneLabel" class="badge">Airport</div>
          <div id="promptJa" class="prompt-ja">音声を聞いてみよう</div>
          <div id="englishText" class="english-text hidden"></div>

          <button id="playBtn" class="play-btn">▶ 英語を聞く</button>
          <div id="speedRow" class="speed-row">
            <button data-speed="0.75">0.75×</button>
            <button class="active" data-speed="1">1.0×</button>
          </div>

          <div id="choices" class="choices"></div>

          <div id="speakArea" class="speak-area hidden">
            <button id="micBtn" class="mic-btn">🎙 話す</button>
            <div id="transcript" class="transcript">ここに聞き取った英語が表示されます</div>
            <button id="manualDoneBtn" class="ghost-btn hidden">声に出して言えた</button>
          </div>

          <div id="feedback" class="feedback"></div>
          <button id="revealBtn" class="ghost-btn hidden">答えを見る</button>
          <button id="nextBtn" class="primary-btn hidden">次へ</button>
        </div>
      </section>

      <section id="settingsView" class="view">
        <button id="settingsBackBtn" class="back-btn">‹ HOME</button>
        <div class="section-head"><div><div class="eyebrow">SETTINGS</div><h2>レベル設定</h2></div></div>
        <div id="levelCards"></div>
      </section>
    </main>
  </div>

  <dialog id="dateDialog">
    <form method="dialog" class="dialog-box">
      <h3>ニューヨーク出発日</h3>
      <input type="date" id="departureInput">
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn">キャンセル</button>
        <button id="saveDateBtn" value="default" class="primary-btn">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
